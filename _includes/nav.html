<style>
  .navbar {
    background: linear-gradient(90deg, #000428, #004e92);
    padding: 12px 20px;
    position: relative;
    z-index: 1100;
    box-shadow: 0 0 10px #00fff7, 0 0 20px #00fff7;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hamburger {
    font-size: 32px;
    color: #00fff7;
    cursor: pointer;
    text-shadow: 0 0 8px #00fff7;
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .hamburger:hover {
    transform: scale(1.2);
    color: #0ff;
  }

  .score {
    color: #00fff7;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    text-shadow: 0 0 8px #00fff7;
    position: relative;
  }

  /* ✨ Score glow animation */
  @keyframes scoreFlash {
    0% { text-shadow: 0 0 5px #00fff7, 0 0 10px #00fff7, 0 0 20px #00fff7; }
    50% { text-shadow: 0 0 20px #00fff7, 0 0 40px #00fff7, 0 0 60px #00fff7; }
    100% { text-shadow: 0 0 5px #00fff7, 0 0 10px #00fff7, 0 0 20px #00fff7; }
  }

  .score.animate {
    animation: scoreFlash 1.2s ease-out;
  }

  /* Side menu */
  .side-menu {
    height: 100%;
    width: 0;
    position: fixed;
    top: 0;
    left: 0;
    background: rgba(0, 10, 30, 0.95);
    border-right: 2px solid #00fff7;
    overflow-x: auto;
    transition: width 0.4s ease;
    padding-top: 60px;
    display: flex;
    flex-direction: column;
    z-index: 1200;
    opacity: 0;
    box-shadow: 0 0 15px #00fff7;
  }

  .side-menu.open {
    width: 270px;
    opacity: 1;
    transition: width 0.4s ease, opacity 0.3s ease;
  }

  .side-menu a {
    padding: 14px 24px;
    text-decoration: none;
    font-size: 20px;
    color: #00fff7;
    display: block;
    transform: translateX(-20px);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease, color 0.3s ease;
    text-shadow: 0 0 8px #00fff7;
  }

  .side-menu.open a {
    transform: translateX(0);
    opacity: 1;
  }

  .side-menu a:hover {
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
  }

  .closebtn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 40px;
    color: #00fff7;
    text-decoration: none;
    transition: transform 0.3s ease;
  }

  .closebtn:hover {
    transform: rotate(90deg);
  }

  #overlay {
    position: fixed;
    display: none;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background-color: rgba(0, 255, 255, 0.1);
    backdrop-filter: blur(4px);
    z-index: 1150;
    transition: opacity 0.3s ease;
    opacity: 0;
  }

  #overlay.show {
    display: block;
    opacity: 1;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const scoreDisplay = document.getElementById("scoreDisplay");
    const scoreWrapper = document.querySelector(".score");
    let score = parseInt(localStorage.getItem("ctfScore")) || 0;
    scoreDisplay.textContent = score;

    /**
     * Adds points to the user's total score if they haven't solved the challenge before.
     * @param {string} challengeId - Unique ID for the current challenge (e.g., "challenge1")
     * @param {number} points - Points to award (default 100)
     */
    window.completeChallenge = function(challengeId, points = 100) {
      const completedChallenges = JSON.parse(localStorage.getItem("completedChallenges")) || [];

      // Only award points if challenge not already completed
      if (!completedChallenges.includes(challengeId)) {
        score += points;
        localStorage.setItem("ctfScore", score);
        completedChallenges.push(challengeId);
        localStorage.setItem("completedChallenges", JSON.stringify(completedChallenges));
        scoreDisplay.textContent = score;

        // Add a glow animation to make it feel rewarding
        scoreWrapper.classList.add("animate");
        setTimeout(() => scoreWrapper.classList.remove("animate"), 1200);
      }
    };

    // Hamburger menu logic
    const hamburger = document.getElementById('hamburger');
    const sideMenu = document.getElementById('side-menu');
    const closeBtn = document.getElementById('closebtn');
    const overlay = document.getElementById('overlay');

    function openMenu() {
      sideMenu.classList.add('open');
      overlay.classList.add('show');
    }

    function closeMenu() {
      sideMenu.classList.remove('open');
      overlay.classList.remove('show');
    }

    hamburger.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);
  });
</script>
